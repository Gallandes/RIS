# Описание HTTP API района (соглашение Р6). Нет описания — нет API.
# Проверить файл можно в https://editor.swagger.io (вставить текст) или
# локально: pipx run openapi-spec-validator contracts/openapi.yaml
openapi: 3.1.0
info:
  title: Район 8 — Городской SOC (API)
  version: 0.1.0
  description: |
    Черновик v0 (неделя 2). Аутентификация появится на неделе 4:
    люди — токен OIDC Паспортного стола (Authorization: Bearer ...),
    сервисы — mTLS с сертификатом городского УЦ.
servers:
  - url: https://api.soc.city.lab
    description: адрес в городе (после недели 3)
  - url: http://127.0.0.1:8080
    description: локальный запуск
paths:
  /health:
    get:
      summary: Проверка работоспособности (для чекера White Team)
      operationId: health
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /api/v1/logs:
    post:
      summary: Приём пачки журналов района (JSON Lines, Р4)
      description: |
        Каждая строка — одна запись журнала. Поле district должно совпадать
        с районом отправителя (с недели 4 — по mTLS-сертификату), иначе
        запись отбрасывается и в журнал SOC пишется log.rejected.
      operationId: ingestLogs
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |
              {"ts":"2026-10-13T05:07:31.415Z","district":"bank","service":"api","level":"WARN","event":"auth.login","outcome":"failure","actor":"u-1024","src_ip":"10.20.4.15","request_id":"a1b2c3d4e5f60718","msg":"неверный пароль"}
      responses:
        "202":
          description: Журналы приняты
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: integer, example: 120}
                  rejected: {type: integer, example: 2}
        "413":
          description: Пачка слишком большая
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429":
          description: Превышен лимит частоты для района
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/incidents:
    get:
      summary: Список инцидентов (для аналитика SOC)
      operationId: listIncidents
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: district
          in: query
          required: false
          description: Код района по Р1
          schema: {type: string, example: bank}
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, investigating, closed]
      responses:
        "200":
          description: Список инцидентов
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Incident"}
        default:
          $ref: "#/components/responses/Problem"
    post:
      summary: Открыть инцидент вручную (аналитик SOC)
      operationId: createIncident
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district, severity, category]
              properties:
                district: {type: string, example: hospital}
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                category: {type: string, example: data.exfiltration}
                request_ids:
                  type: array
                  items: {type: string}
                note: {type: string, maxLength: 1000}
      responses:
        "201":
          description: Инцидент открыт, опубликовано city.soc.incident.opened.v1
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/incidents/{incidentId}:
    get:
      summary: Карточка инцидента
      operationId: getIncident
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: incidentId
          in: path
          required: true
          schema: {type: string, example: INC-2026-0042}
      responses:
        "200":
          description: Инцидент
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sources:
    get:
      summary: Статус источников журналов (поиск слепых зон)
      operationId: listSources
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Когда от каждого района последний раз пришли журналы
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    district: {type: string, example: grid}
                    last_seen: {type: string, format: date-time, example: "2026-10-13T05:07:31.415Z"}
                    silent: {type: boolean, example: false}
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Сквозной идентификатор запроса; если нет — сервис создаёт новый
      schema: {type: string, maxLength: 64}
  schemas:
    Incident:
      type: object
      properties:
        incident_id: {type: string, example: INC-2026-0042}
        district: {type: string, example: bank}
        severity:
          type: string
          enum: [low, medium, high, critical]
        category: {type: string, example: auth.bruteforce}
        status:
          type: string
          enum: [open, investigating, closed]
        rule_id: {type: string, example: SOC-R-003}
        opened_at: {type: string, format: date-time, example: "2026-10-13T05:07:31.415Z"}
        request_ids:
          type: array
          items: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
