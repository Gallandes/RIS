# Описание HTTP API района (соглашение Р6). Нет описания — нет API.
# Проверить файл можно в https://editor.swagger.io (вставить текст) или
# локально: pipx run openapi-spec-validator contracts/openapi.yaml
openapi: 3.1.0
info:
  title: Район 8 — Городской SOC (API)
  version: 0.1.0
  description: |
    Черновик v0 (неделя 2). Аутентификация появится на неделе 4:
    люди — токен OIDC Паспортного стола (Authorization: Bearer ...),
    сервисы — mTLS с сертификатом городского УЦ.
servers:
  - url: https://api.soc.city.lab
    description: адрес в городе (после недели 3)
  - url: http://127.0.0.1:8080
    description: локальный запуск
paths:
  /health:
    get:
      summary: Проверка работоспособности (для чекера White Team)
      operationId: health
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /api/v1/info:
    get:
      summary: Пример эндпоинта — замените на настоящие операции района
      operationId: getInfo
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Информация о сервисе
          content:
            application/json:
              schema:
                type: object
                properties:
                  district: {type: string, example: soc}
                  service: {type: string, example: api}
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Сквозной идентификатор запроса; если нет — сервис создаёт новый
      schema: {type: string, maxLength: 64}
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
